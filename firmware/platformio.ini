; DIY e-reader firmware
; Build:  pio run            Flash: pio run -t upload        Monitor: pio device monitor
; Host unit tests (no hardware): pio test -e native

[platformio]
default_envs = feather_s3

[env]
test_framework = unity

[env:feather_s3]
platform = espressif32
board = adafruit_feather_esp32s3   ; 4 MB flash, 2 MB PSRAM (Adafruit 5477)
framework = arduino
; one 2.8 MB app slot instead of two OTA slots: Wi-Fi + web server do not fit 1.4 MB
board_build.partitions = tinyuf2-partitions-4MB-noota.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_MODE=0   ; TinyUSB: USB serial + mass storage on the USB-C port
lib_deps =
    zinggjm/GxEPD2@^1.6.0
; on-device tests are not set up yet; host tests run in env:native
test_ignore = *

; Browser simulator: the same firmware built with Emscripten to WebAssembly,
; on simulated hardware (sim/). Needs emcc.  pio run -e sim -t serve
[env:sim]
platform = native
lib_compat_mode = off
lib_deps =
    ${env:feather_s3.lib_deps}
    epdsim
lib_ignore = Adafruit BusIO
extra_scripts = pre:sim/build.py
build_flags = -Wall
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17 -Wall -DFIXTURES_DIR=\"$PROJECT_DIR/test/fixtures\"
lib_compat_mode = off
