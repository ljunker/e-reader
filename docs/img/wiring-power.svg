<svg xmlns='http://www.w3.org/2000/svg' width='820' height='330' viewBox='0 0 820 330' font-family='Helvetica, Arial, sans-serif' font-size='14'>
<title>Power wiring</title>
<rect width='820' height='330' fill='#ffffff'/>
<text x='410.0' y='34' font-size='20' text-anchor='middle' font-weight='bold' fill='#222'>Power: LiPo → slide switch → FeatherS3[D]</text>
<rect x='40' y='90' width='170' height='130' rx='8' fill='#e0b400' stroke='#333' stroke-width='2'/>
<text x='125' y='140' font-size='18' text-anchor='middle' font-weight='bold' fill='#222'>LiPo</text>
<text x='125' y='162' font-size='13' text-anchor='middle' font-weight='normal' fill='#222'>1500–2000 mAh</text>
<text x='125' y='180' font-size='13' text-anchor='middle' font-weight='normal' fill='#222'>with protection</text>
<rect x='330' y='70' width='140' height='70' rx='8' fill='#333' stroke='#333' stroke-width='2'/>
<text x='400' y='100' font-size='14' text-anchor='middle' font-weight='bold' fill='#fff'>SS12D00</text>
<text x='400' y='120' font-size='12' text-anchor='middle' font-weight='normal' fill='#ddd'>slide switch</text>
<circle cx='370' cy='140' r='5' fill='#d9b44a' stroke='#333'/>
<circle cx='400' cy='140' r='5' fill='#d9b44a' stroke='#333'/>
<circle cx='430' cy='140' r='5' fill='#d9b44a' stroke='#333'/>
<text x='470' y='62' font-size='11' text-anchor='end' font-weight='normal' fill='#555'>third pin unused</text>
<rect x='600' y='90' width='180' height='130' rx='8' fill='#2b4fa8' stroke='#333' stroke-width='2'/>
<text x='690' y='130' font-size='16' text-anchor='middle' font-weight='bold' fill='#fff'>FeatherS3[D]</text>
<text x='690' y='152' font-size='13' text-anchor='middle' font-weight='normal' fill='#fff'>BAT JST-PH 2.0</text>
<text x='690' y='200' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#fff'>USB-C charges</text>
<circle cx='600' cy='120' r='6' fill='#d9b44a' stroke='#333'/><circle cx='600' cy='175' r='6' fill='#d9b44a' stroke='#333'/>
<text x='588' y='116' font-size='16' text-anchor='end' font-weight='bold' fill='#222'>+</text>
<text x='588' y='192' font-size='16' text-anchor='end' font-weight='bold' fill='#222'>−</text>
<polyline points='210,120 300,120 300,160 370,160 370,145' fill='none' stroke='#d62728' stroke-width='5' stroke-linejoin='round'/>
<polyline points='400,145 400,175 520,175 520,120 594,120' fill='none' stroke='#d62728' stroke-width='5' stroke-linejoin='round'/>
<polyline points='210,190 560,190 560,175 594,175' fill='none' stroke='#111111' stroke-width='5' stroke-linejoin='round'/>
<text x='222' y='112' font-size='16' text-anchor='start' font-weight='bold' fill='#222'>+</text>
<text x='222' y='210' font-size='16' text-anchor='start' font-weight='bold' fill='#222'>−</text>
<rect x='40' y='245' width='740' height='60' rx='8' fill='#fff4e5' stroke='#e08a00' stroke-width='2'/>
<text x='56' y='270' font-size='14' text-anchor='start' font-weight='bold' fill='#8a4b00'>⚠ JST plugs exist with both polarities. Compare red/black of the battery with the + / − marks</text>
<text x='56' y='290' font-size='14' text-anchor='start' font-weight='bold' fill='#8a4b00'>next to the board's battery connector before plugging in. Swap the crimp pins if needed.</text>
</svg>
